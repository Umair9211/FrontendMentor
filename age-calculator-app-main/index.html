<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Age calculator app</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="input-field">
          <div class="field">
            <label id="d">Day</label>
            <input type="number" id="dayInput" />
          </div>
          <div class="field">
            <label id="m">Month</label>
            <input type="number" id="monthInput" />
          </div>
          <div class="field">
            <label id="y">Year</label>
            <input type="number" id="yearInput" />
          </div>
        </div>
        <div class="logo-container">
          <div class="bar"></div>
          <div class="logo" id="logo-bg">
            <img src="./assets/images/icon-arrow.svg" alt="logo" />
          </div>
        </div>
        <div class="date-cal">
          <h1><span id="years">--</span> years</h1>
          <h1><span id="months">--</span> months</h1>
          <h1><span id="days">--</span> days</h1>
        </div>
      </div>
      <div class="attribution">
        Challenge by
        <a target="_blank" href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a target="_blank" href="https://github.com/Umair9211">Umair Farooq</a>.
      </div>
    </main>
   
  </body>
</html>
<script>
function validateInput() {
    let day = document.getElementById("dayInput").value.trim();
    let month = document.getElementById("monthInput").value.trim();
    let year = document.getElementById("yearInput").value.trim();
 const today = new Date();

    // Reset styles
    document.getElementById("m").style.color = "var(--Smokey-grey)";
    document.getElementById("d").style.color = "var(--Smokey-grey)";
    document.getElementById("y").style.color = "var(--Smokey-grey)";


    let isValid = true;

    if (day) {
        day = parseInt(day);
        if (day < 1 || day > 31) {
            document.getElementById("dayInput").style.border = "1px solid red";
            document.getElementById("d").style.color = "red";
            isValid = false;
        }
    }

    if (month) {
        month = parseInt(month);
        if (month < 1 || month > 12) {
            document.getElementById("monthInput").style.border = "1px solid red";
            document.getElementById("m").style.color = "red";
            isValid = false;
        }
    }

    if (year) {
        year = parseInt(year);
        if (year < 0 || year > today.getFullYear()) {
            document.getElementById("yearInput").style.border = "1px solid red";
            document.getElementById("y").style.color = "red";
            isValid = false;
        }
    }

    if (!isValid) {
          
    document.getElementById("years").innerText ="--";
    document.getElementById("months").innerText ="--";
    document.getElementById("days").innerText = "--";
        return; 
    }

    if (day && month && year) {
      document.getElementById("monthInput").style.border = "var(--Smokey-grey)";
    document.getElementById("dayInput").style.border = "var(--Smokey-grey)";
    document.getElementById("yearInput").style.border = "var(--Smokey-grey)";
        calculateAge();
    }
}

function calculateAge() {
    let day = parseInt(document.getElementById("dayInput").value.trim());
    let month = parseInt(document.getElementById("monthInput").value.trim());
    let year = parseInt(document.getElementById("yearInput").value.trim());
    const today = new Date();

    let ageYears = today.getFullYear() - year;
    let ageMonths = today.getMonth() + 1 - month;
    let ageDays = today.getDate() - day;

    if (ageDays < 0) {
        ageMonths -= 1;
        ageDays += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }
    if (ageMonths < 0) {
        ageYears -= 1;
        ageMonths += 12;
    }

    
    document.getElementById("years").innerText = ageYears;
    document.getElementById("months").innerText = ageMonths;
    document.getElementById("days").innerText = ageDays;
    document.getElementById("logo-bg").style.backgroundColor = `var(--Purple)`;
}

document.getElementById("dayInput").addEventListener("input", validateInput);
document.getElementById("monthInput").addEventListener("input", validateInput);
document.getElementById("yearInput").addEventListener("input", validateInput);
 


</script>
